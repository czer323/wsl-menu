name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File test-conversion.ps1
